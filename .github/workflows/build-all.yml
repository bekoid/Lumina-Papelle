name: Lumina Papelle - Multi-Platform Build (Android, Windows, Mac)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'

jobs:
  # ==========================================
  # 1. ANDROID APK BUILD
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Copy Web Assets to Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          node ./node_modules/@capacitor/cli/bin/capacitor copy android || true

      - name: Accept Android Licenses & Fix Permissions
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a518e41ce35dd649036745c78f1\nd56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license" || true
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew
        working-directory: android

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: android

      - name: Package APK for Download
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/Lumina-Papelle.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumina-Papelle-Android-APK
          path: apk-output/Lumina-Papelle.apk

  # ==========================================
  # 2. WINDOWS SETUP & PORTABLE BUILD
  # ==========================================
  build-windows:
    name: Build Windows Setup & Portable
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Windows Installers (NSIS Setup & Portable)
        run: npm run build:win

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lumina-Papelle-Windows
          path: |
            release/*.exe

  # ==========================================
  # 3. MACOS DMG & ZIP BUILD
  # ==========================================
  build-mac:
    name: Build macOS DMG & ZIP
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build macOS Applications (DMG & ZIP)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:mac

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lumina-Papelle-macOS
          path: |
            release/*.dmg
            release/*.zip

  # ==========================================
  # 4. GITHUB RELEASE (Triggered on Tags: v*)
  # ==========================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-windows, build-mac]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Lumina-Papelle-Android-APK
          path: release-bundle

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Lumina-Papelle-Windows
          path: release-bundle

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Lumina-Papelle-macOS
          path: release-bundle

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-bundle/*
          draft: false
          prerelease: false
          generate_release_notes: true
