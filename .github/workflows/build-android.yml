name: Build Lumina Papelle Android (APK)

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Copy Web Assets to Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          node ./node_modules/@capacitor/cli/bin/capacitor copy android || true

      - name: Accept Android Licenses & Fix Permissions
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a518e41ce35dd649036745c78f1\nd56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license" || true
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew
        working-directory: android

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: android

      - name: Package APK for Download
        run: |
          mkdir -p apk-output
          find android -name "*.apk" -exec cp -v {} apk-output/Lumina-Papelle.apk \;

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumina-Papelle-Android-APK
          path: apk-output/Lumina-Papelle.apk
